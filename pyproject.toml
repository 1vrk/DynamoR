[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamor"
version = "0.1.0"
description = "build helper"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "polars",
    "pyyaml",
    "tzdata"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]